name: Métricas Scrum (burndown / burnup)

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, milestoned, demilestoned]
  schedule:
    - cron: "50 22 * * *"   # 23:50 en Madrid (horario de invierno): foto de cierre del día
  workflow_dispatch:
    inputs:
      reiniciar:
        description: "Reconstruir desde cero el histórico de un sprint (ej. S3). Vacío = no"
        required: false
        default: ""
      recomprometer:
        description: "Fijar el compromiso (inicio de la línea ideal) de un sprint al total actual (ej. S3). Vacío = no"
        required: false
        default: ""

permissions:
  contents: write
  issues: read

concurrency:
  group: metricas
  cancel-in-progress: true

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install matplotlib

      - name: Generar gráficas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REINICIAR: ${{ github.event.inputs.reiniciar }}
          RECOMPROMETER: ${{ github.event.inputs.recomprometer }}
        run: python scripts/metricas.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagramas README.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore(metricas): actualizar burndown y burnup"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push